name: Build Firmware

on:
  push:
    branches: [main, fix/reading-stats-recovery]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core 6.2.0.post1
        run: |
          uv pip install --system -U 'pioarduino==6.2.0.post1'
          python scripts/patch_pioarduino_core_version.py
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-v1-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-v1-${{ runner.os }}-

      - name: Pin pioarduino core inside platform penv
        run: |
          pio pkg install -e default
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.2.0.post1"
          ~/.platformio/penv/bin/python scripts/patch_pioarduino_core_version.py

      - name: Build firmware
        run: pio run -e default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/default/firmware.bin
          retention-days: 90