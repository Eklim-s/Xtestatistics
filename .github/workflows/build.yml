name: Build Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO and SCons
        run: |
          pip install platformio scons==4.4.0

      - name: Generate I18n
        run: python scripts/gen_i18n.py lib/I18n/translations lib/I18n/

      - name: Build firmware
        run: pio run -e default

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/default/firmware.bin
          retention-days: 90